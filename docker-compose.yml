services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: orders
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d orders"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Not part of the usual local dev loop (`npm run dev` against `npm run db:up` is faster —
  # no image rebuild on every change). This is here so the Dockerfile itself is exercised
  # end-to-end: `docker compose up --build app` runs the whole stack from the built image.
  app:
    build: .
    environment:
      PORT: 3000
      NODE_ENV: production
      # Talks to the `db` service by its Docker-network name, on the container's own port 5432 —
      # not the host-mapped 5433 above, which only matters from outside this network.
      DATABASE_URL: postgres://app:app@db:5432/orders
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
